name: Vertex Docker Hub

# Builds the vertex-qui image and pushes it to Docker Hub. It has its own file and
# runs on the vertex branch and vertex-v* tags only, so upstream's release.yml, which
# runs on main, develop and v* tags, stays untouched and merges cleanly.
#
# Repository settings it needs:
#   variable DOCKERHUB_USERNAME  the Docker Hub account; the image is <account>/vertex-qui
#   secret   DOCKERHUB_TOKEN     a Docker Hub access token with read and write access

on:
  push:
    branches:
      - "vertex"
    tags:
      - "vertex-v*"
    paths-ignore:
      - "**.md"
      - "documentation/**"
  workflow_dispatch:

env:
  NODE_VERSION: "24.15.0"
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vertex-qui

permissions:
  contents: read

concurrency:
  group: vertex-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check translations
        working-directory: web
        run: pnpm check:i18n

      - name: Type check and build frontend
        working-directory: web
        run: CI= pnpm run build

      - name: Upload web production build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create placeholder web dist for embed
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  docker:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    needs: [web, test]
    steps:
      - name: Check Docker Hub settings
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret in the repository settings."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download web production build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest and vertex follow the branch, sha-<commit> pins one build, and a
      # vertex-v1.2.3 tag also gives 1.2.3 and 1.2.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/vertex' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=vertex-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=vertex-v(\d+\.\d+),group=1
          flavor: |
            latest=false

      # Go cross-compiles on the runner; QEMU only runs the final stage's package install.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./distrib/docker/ci.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vertex-docker
          cache-to: type=gha,mode=max,scope=vertex-docker
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}
            BUILDER=${{ github.actor }}@github-actions
          provenance: false
